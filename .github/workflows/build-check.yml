name: Build Check

on:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Electron smoke
        run: npm run test:smoke

      - name: Electron visual matrix
        run: npm run test:visual

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neko-status-visual-artifacts
          if-no-files-found: ignore
          path: |
            tests/visual/artifacts/**

      - name: Build Windows packages
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-status-build-check
          path: |
            dist/*.exe
            dist/*.zip
