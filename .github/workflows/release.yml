name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-nightly.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL || 'https://git.koirin.com:39520' }}
      GITEA_OWNER: ${{ vars.GITEA_OWNER || 'NF' }}
      GITEA_REPO: ${{ vars.GITEA_REPO || 'Neko' }}
      GITEA_MIRROR_URL: ${{ vars.GITEA_MIRROR_URL || 'https://git.koirin.com:39520/NF/Neko.git' }}
      GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN }}
      HAS_GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN != '' }}
      HAS_GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smart sync Git refs to personal repository
        if: env.HAS_GITEA_MIRROR_TOKEN == 'true' || startsWith(env.GITEA_MIRROR_URL, 'git@') || startsWith(env.GITEA_MIRROR_URL, 'ssh://')
        run: node scripts/sync-git-mirror.js

      - name: Validate release tag matches package version
        shell: pwsh
        run: |
          $refType = "${{ github.ref_type }}"
          if ($refType -ne "tag") {
            Write-Error "Release workflow must run from a v* tag. Current ref type: $refType"
            exit 1
          }

          $tagVersion = "${{ github.ref_name }}" -replace '^v',''
          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            Write-Error "Tag version ($tagVersion) does not match package.json version ($packageVersion)."
            exit 1
          }

          echo "VERSION=$tagVersion" >> $env:GITHUB_ENV

      - name: Verify
        run: npm run verify

      - name: Build Electron package
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SHA256 sums
        shell: pwsh
        run: |
          $distDir = "dist"
          $sumsPath = "$distDir\SHA256SUMS.txt"
          if (Test-Path $sumsPath) { Remove-Item $sumsPath }

          $releaseAssets = @(
            "$distDir\NekoStatus-Setup-$env:VERSION.exe",
            "$distDir\NekoStatus-$env:VERSION-win.zip"
          )
          foreach ($asset in $releaseAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              Write-Error "Release asset missing: $asset"
              exit 1
            }
            $item = Get-Item -LiteralPath $asset
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($item.Name)" | Out-File -FilePath $sumsPath -Append -Encoding utf8
          }

      - name: Resolve release flags
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '-beta\.' -or $tag -match '-nightly\.') {
            echo "IS_PRERELEASE=true" >> $env:GITHUB_ENV
          } else {
            echo "IS_PRERELEASE=false" >> $env:GITHUB_ENV
          }

      - name: Resolve release notes
        shell: pwsh
        run: |
          if (Test-Path "release_notes.txt") {
            $notes = Get-Content "release_notes.txt" -Raw -Encoding utf8
            if ($notes.Trim()) {
              $bodyFile = "release_body.md"
              [System.IO.File]::WriteAllText($bodyFile, $notes.TrimEnd(), [System.Text.Encoding]::UTF8)
              echo "HAS_CUSTOM_NOTES=true" >> $env:GITHUB_ENV
              echo "BODY_FILE=$bodyFile" >> $env:GITHUB_ENV
              exit 0
            }
          }
          echo "HAS_CUSTOM_NOTES=false" >> $env:GITHUB_ENV

      - name: Create GitHub Release from release_notes.txt
        if: env.HAS_CUSTOM_NOTES == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Neko Status ${{ github.ref_name }}"
          prerelease: ${{ env.IS_PRERELEASE }}
          body_path: ${{ env.BODY_FILE }}
          files: |
            dist/NekoStatus-Setup-${{ env.VERSION }}.exe
            dist/NekoStatus-${{ env.VERSION }}-win.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release with generated notes
        if: env.HAS_CUSTOM_NOTES == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: "Neko Status ${{ github.ref_name }}"
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            dist/NekoStatus-Setup-${{ env.VERSION }}.exe
            dist/NekoStatus-${{ env.VERSION }}-win.zip
            dist/SHA256SUMS.txt

      - name: Sync personal Gitea Release
        if: env.HAS_GITEA_RELEASE_TOKEN == 'true'
        run: npm run release:gitea -- --version "${{ env.VERSION }}" --tag "${{ github.ref_name }}"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
