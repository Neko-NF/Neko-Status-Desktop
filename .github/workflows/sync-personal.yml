name: Sync Personal Repository

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEA_MIRROR_URL: ${{ vars.GITEA_MIRROR_URL || 'https://git.koirin.com:39520/NF/Neko.git' }}
      GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN }}
      HAS_GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN != '' }}

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Smart sync Git refs to personal repository
        if: env.HAS_GITEA_MIRROR_TOKEN == 'true' || startsWith(env.GITEA_MIRROR_URL, 'git@') || startsWith(env.GITEA_MIRROR_URL, 'ssh://')
        run: node scripts/sync-git-mirror.js

      - name: Explain skipped sync
        if: env.HAS_GITEA_MIRROR_TOKEN != 'true' && !startsWith(env.GITEA_MIRROR_URL, 'git@') && !startsWith(env.GITEA_MIRROR_URL, 'ssh://')
        run: |
          echo "Personal repository sync skipped."
          echo "Set GITEA_MIRROR_TOKEN, or set GITEA_MIRROR_URL to an SSH push URL with runner credentials."
