<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neko Status - 开发者模式</title>
    <link rel="stylesheet" href="../../node_modules/@phosphor-icons/web/src/regular/style.css">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/developer-mode-panel.css">
</head>
<body>
    <main class="dev-panel-shell">
        <header class="dev-panel-header">
            <div class="dev-panel-brand">
                <span class="dev-panel-mark"><i class="ph ph-brackets-curly"></i></span>
                <h1>开发者模式</h1>
            </div>
            <button class="dev-icon-btn" id="closePanelBtn" title="关闭开发者模式" aria-label="关闭开发者模式">
                <i class="ph ph-x"></i>
            </button>
        </header>

        <section class="dev-action-grid">
            <button class="dev-action-btn" id="toggleInspectBtn" type="button">
                <i class="ph ph-selection"></i>
                <span>检查元素</span>
            </button>
            <button class="dev-action-btn" id="refreshBackendBtn" type="button">
                <i class="ph ph-plugs-connected"></i>
                <span>刷新快照</span>
            </button>
            <button class="dev-action-btn" id="rescanBtn" type="button">
                <i class="ph ph-crosshair"></i>
                <span>重扫界面</span>
            </button>
            <button class="dev-action-btn" id="copySnapshotBtn" type="button">
                <i class="ph ph-clipboard-text"></i>
                <span>复制快照</span>
            </button>
        </section>

        <section class="dev-panel-card">
            <div class="dev-section-head">
                <span>调试工具</span>
                <small>窗口、DevTools 与缓存</small>
            </div>
            <div class="dev-tool-grid">
                <button class="dev-tool-btn" id="openMainDevToolsBtn" type="button" title="打开主界面 DevTools"><i class="ph ph-browser"></i><span>主界面 DevTools</span></button>
                <button class="dev-tool-btn" id="openPanelDevToolsBtn" type="button" title="打开开发者侧窗 DevTools"><i class="ph ph-sidebar-simple"></i><span>侧窗 DevTools</span></button>
                <button class="dev-tool-btn" id="reloadMainBtn" type="button"><i class="ph ph-arrow-clockwise"></i><span>重载主窗口</span></button>
                <button class="dev-tool-btn" id="reloadPanelBtn" type="button"><i class="ph ph-arrows-clockwise"></i><span>重载面板</span></button>
                <button class="dev-tool-btn" id="focusMainBtn" type="button"><i class="ph ph-crosshair-simple"></i><span>聚焦主窗口</span></button>
                <button class="dev-tool-btn" id="clearCacheBtn" type="button"><i class="ph ph-broom"></i><span>清理缓存</span></button>
            </div>
        </section>

        <section class="dev-panel-card">
            <div class="dev-section-head">
                <span>诊断开关</span>
                <small>更新链路与辅助线</small>
            </div>
            <div class="dev-switch-list">
                <div class="dev-inline-setting">
                    <span>包含隐藏层</span>
                    <button class="dev-switch" id="includeHiddenSwitch" type="button" aria-pressed="false">
                        <span></span>
                    </button>
                </div>
                <div class="dev-inline-setting">
                    <span>智能更新源</span>
                    <button class="dev-switch" id="updateSourceModeSwitch" type="button" aria-pressed="false">
                        <span></span>
                    </button>
                </div>
                <div class="dev-inline-setting">
                    <span>自动检查更新</span>
                    <button class="dev-switch" id="autoCheckUpdateSwitch" type="button" aria-pressed="false">
                        <span></span>
                    </button>
                </div>
                <div class="dev-inline-setting">
                    <span>自动下载更新</span>
                    <button class="dev-switch" id="autoDownloadSwitch" type="button" aria-pressed="false">
                        <span></span>
                    </button>
                </div>
            </div>
            <div class="dev-tool-grid dev-tool-grid-compact">
                <button class="dev-tool-btn" id="runHealthCheckBtn" type="button"><i class="ph ph-heartbeat"></i><span>服务体检</span></button>
                <button class="dev-tool-btn" id="runUpdateIntegrityBtn" type="button"><i class="ph ph-shield-check"></i><span>更新完整性</span></button>
            </div>
        </section>

        <section class="dev-panel-card">
            <div class="dev-section-head">
                <span>后端</span>
                <small>IPC 聚合状态</small>
            </div>
            <div class="dev-backend-grid" id="backendList"></div>
        </section>

        <section class="dev-panel-card">
            <div class="dev-section-head">
                <span>运行时</span>
                <small>应用、缓存与进程</small>
            </div>
            <div class="dev-backend-grid" id="runtimeList"></div>
        </section>

        <section class="dev-panel-card">
            <div class="dev-section-head">
                <span>更新</span>
                <small>更新源与待安装包</small>
            </div>
            <div class="dev-backend-grid" id="updateList"></div>
        </section>

        <section class="dev-panel-card">
            <div class="dev-section-head">
                <span>最近诊断</span>
                <small>调试动作结果</small>
            </div>
            <div class="dev-diagnostics-list" id="diagnosticsList"></div>
        </section>

        <section class="dev-panel-card dev-inspect-card" id="inspectCard">
            <div class="dev-section-head">
                <span>UI 定位</span>
                <small id="inspectHint">点击辅助线框锁定详情</small>
            </div>
            <div class="dev-empty dev-inspect-empty" id="inspectEmpty">尚未选择元素</div>
            <div class="dev-details" id="inspectDetails" hidden></div>
        </section>
    </main>

    <script src="./js/developer-mode-panel.js"></script>
</body>
</html>
